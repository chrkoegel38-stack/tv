<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>nw_tv</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #p, iframe { width: 100%; height: 100%; border: 0; background: #000; }
</style>
</head>
<body>
<div id="p"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  // Diese Seite wird vom Server per HTTP ausgeliefert (nicht als nui://), damit YouTube eine
  // gueltige Herkunft sieht (sonst "Fehler 153"). Gesteuert wird sie per Nachricht vom Skript.
  let yt = null, apiReady = false, curId = null, last = null, twitchSet = false, seekDecided = false, wantSeek = false, lastRs = null;

  function onYouTubeIframeAPIReady() { apiReady = true; if (last && last.action === 'yt') playYt(last); }

  function fresh() {
    const old = document.getElementById('p');
    const el = document.createElement('div');
    el.id = 'p';
    if (old) old.replaceWith(el); else document.body.appendChild(el);
  }

  function applyYt(d) {
    if (!yt || typeof yt.setVolume !== 'function') return;
    yt.setVolume(Math.round(Math.max(0, Math.min(1, d.volume ?? 1)) * 100));
    // Nur EINMAL beim Laden zur Startposition springen (fuer Zuschauer, die spaeter dazukommen).
    // Danach nie wieder: Werbung vor dem Video verzoegert den Start, und ein Nachspringen wuerde
    // das Video um die Werbedauer ueberspringen. Laeuft der Link laenger als das Video, wird modulo
    // der Laenge gesprungen, sobald die Laenge bekannt ist.
    // Gemeinsamer Neustart ("Fuer alle von vorn starten"): ein neuer rs-Wert heisst "jetzt zurueck auf 0".
    if (lastRs === null) {
      lastRs = d.rs || 0;
    } else if ((d.rs || 0) !== lastRs) {
      lastRs = d.rs || 0;
      wantSeek = false;
      try { yt.seekTo(0, true); } catch (e) {}
    }
    // Ob gesprungen wird, wird GLEICH BEIM ERSTEN Aufruf entschieden: Wer den Link selbst startet (Position
    // nahe 0), springt nie. Nur wer spaeter dazukommt, springt einmal zur Live-Position. So kann die
    // Werbung vorn nicht mehr dazu fuehren, dass nach der Werbung Sekunden uebersprungen werden.
    if (!seekDecided) {
      seekDecided = true;
      wantSeek = (d.start || 0) > 10;
    }
    if (wantSeek) {
      const dur = typeof yt.getDuration === 'function' ? yt.getDuration() : 0;
      if (dur > 1 && typeof yt.seekTo === 'function') {
        yt.seekTo((d.start || 0) % dur, true);
        wantSeek = false;
      }
    }
    if (d.paused) yt.pauseVideo(); else yt.playVideo();
  }

  function playYt(d) {
    last = d;
    if (!apiReady) return;
    if (yt && curId === d.id) { applyYt(d); return; }
    if (yt) { try { yt.destroy(); } catch (e) {} yt = null; }
    fresh();
    curId = d.id;
    seekDecided = false;
    wantSeek = false;
    lastRs = null;
    yt = new YT.Player('p', {
      videoId: d.id,
      // cc_load_policy 0 + unloadModule: keine Untertitel (der Browser hat kein Konto, YouTube nimmt sonst die Standardspur)
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0, iv_load_policy: 3, fs: 0, playsinline: 1, cc_load_policy: 0, hl: 'de' },
      events: {
        onReady: () => {
          try { yt.unloadModule('captions'); yt.unloadModule('cc'); } catch (e) {}
          applyYt(last);
        },
        // Video zu Ende: sofort von vorn, damit nie der Endbildschirm mit Vorschlaegen erscheint
        onStateChange: (e) => { if (e.data === 0) { e.target.seekTo(0, true); e.target.playVideo(); } },
      },
    });
  }

  function playTwitch(d) {
    if (twitchSet) return;
    twitchSet = true;
    if (yt) { try { yt.destroy(); } catch (e) {} yt = null; }
    fresh();
    const f = document.createElement('iframe');
    f.allow = 'autoplay; fullscreen';
    f.src = 'https://player.twitch.tv/?channel=' + encodeURIComponent(d.channel) +
            '&parent=' + encodeURIComponent(location.hostname) + '&autoplay=true&muted=false';
    document.getElementById('p').appendChild(f);
  }

  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.action === 'yt') playYt(d);
    else if (d.action === 'twitch') playTwitch(d);
  });
</script>
</body>
</html>
